# ============================================================================
# XyloBot central config — edit this ONE file, every tool reads from it.
#
# Copy to configs/stampbot.local.yaml to override without touching git:
#     cp configs/stampbot.yaml configs/stampbot.local.yaml
# The CLI auto-loads stampbot.local.yaml if present.
#
# Defaults below match the reBot Arm B601-RS (Robstride) per the Seeed wiki:
#   https://wiki.seeedstudio.com/rebot_arm_b601_rs_lerobot/
# ============================================================================

# --- Follower arm: reBot Arm B601-RS (the arm that strikes the xylophone) ----
# The RS follower talks over SocketCAN, so its "port" is a CAN interface
# (can0), NOT a /dev/tty* serial device. Bring it up first:
#     sudo ip link set can0 up type can bitrate 1000000     (or: stampbot can-up)
follower:
  type: seeed_b601_rs_follower
  port: can0                # CAN interface (not a serial path)
  id: follower1
  can_adapter: socketcan    # RS uses socketcan (DM used damiao)

# --- Leader arm: Star Arm / reBot Arm 102 (move by hand to demonstrate) ------
leader:
  type: rebot_arm_102_leader
  port: /dev/ttyUSB0        # <-- CHANGE ME if different (run `stampbot find-ports`)
  id: rebot_arm_102_leader
  # NOTE: on the RS the leader has NO joint_directions field (verified on
  # hardware) — direction handling lives on the FOLLOWER. Leave this null;
  # the toolkit drops it for the leader automatically if set.
  joint_directions: null

# --- Cameras (observation space for the policy) -----------------------------
# Matches the reference machine's 30fps devices: `front` on /dev/video0, `side`
# on /dev/video4, both MJPG (fourcc "MJPG" is needed to hit these resolutions at
# 30 on these USB cams — without it cv2.VideoCapture can hang on connect).
# `index_or_path` is the OpenCV device index (0,1,2...) or a /dev/video* path.
# Remove a camera you don't have.
#
# FRAMERATE FINDINGS (reference machine):
#   - front /dev/video0 is the external "LRCP G720P" camera: 30fps, 640x480.
#   - side  /dev/video4 is the integrated-webcam's 30fps node: 30fps, 640x360.
#   - AVOID the integrated-cam node /dev/video2 — it only does 10fps.
#   - Run `lerobot-find-cameras opencv` and pick the 30fps-capable devices;
#     a camera can expose several /dev/video* nodes with different max fps.
#   - Every camera here maxes at 30fps. Recording at 60fps would require
#     60fps-capable cameras (these are not) — do not raise fps past 30.
cameras:
  front:
    type: opencv
    index_or_path: /dev/video0   # external "LRCP G720P" camera (30fps, 640x480)
    width: 640
    height: 480
    fps: 30
    fourcc: MJPG
  side:
    type: opencv
    index_or_path: /dev/video4   # integrated-webcam 30fps node (30fps, 640x360)
    width: 640
    height: 360
    fps: 30
    fourcc: MJPG

# --- Dataset (recorded demonstrations) --------------------------------------
dataset:
  repo_id: CHANGE_ME/xylobot_xylophone   # <HF_USER>/<name>
  # A mallet is picked up by the end-effector and used to strike the xylophone
  # bars. The policy plays notes by targeting different bars along the keyboard.
  single_task: "Pick up the mallet and strike the xylophone to play a note."
  fps: 30
  num_episodes: 50          # target number of demos
  episode_time_s: 30        # max seconds per episode
  reset_time_s: 10          # pause between episodes to reset the scene
  push_to_hub: true         # upload to Hugging Face Hub after recording
  root: null                # local dir override (null = ~/.cache/huggingface/lerobot)
  # The guided recorder cycles these hints each demo so you vary the scene.
  # For xylophone playing, vary which bars to target and the rig layout:
  start_states:
    - "target the LOW bars (left end)"
    - "target the MIDDLE bars"
    - "target the HIGH bars (right end)"
    - "mallet rotated / shifted"
    - "xylophone moved within reach"

# --- Policy / training ------------------------------------------------------
policy:
  type: act                 # act (prototype) | pi0 (VLA finetune)
  device: cuda              # cuda | cpu | mps
  batch_size: 8
  steps: 100000
  output_dir: outputs/train/act_xylobot
  job_name: act_xylobot
  wandb: false

# --- CAN interface (RS follower uses SocketCAN) -----------------------------
can:
  interface: can0
  bitrate: 1000000          # 1 Mbit/s

# --- Misc -------------------------------------------------------------------
hf_user: CHANGE_ME          # your Hugging Face username (for repo ids)
