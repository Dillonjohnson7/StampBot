[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stampbot"
version = "0.1.0"
description = "XyloBot — imitation-learning toolkit for a reBot Arm B601-RS xylophone-playing robot (LeRobot ACT/pi0)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Dillon Johnson" }]
dependencies = [
    "pyyaml>=6.0",
]

# NOTE: LeRobot for the B601-RS is NOT plain upstream. The reference setup is a
# `rebot_lerobot` LeRobot install PLUS the `lerobot_robot_seeed_b601` plugin
# (which registers the `seeed_b601_rs_follower` type) on Python 3.10 — see
# docs/hardware-bringup.md and the Seeed RS wiki. So we do NOT declare LeRobot as
# a dependency here (that would pull the wrong build). Install StampBot INTO the
# existing rebot_lerobot venv with `pip install -e .`; it only adds this CLI.
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
xylobot = "stampbot.cli:main"
xb = "stampbot.cli:main"
# legacy aliases kept so existing installs/sessions don't break
stampbot = "stampbot.cli:main"
sb = "stampbot.cli:main"

[tool.setuptools.packages.find]
include = ["stampbot*"]

[tool.ruff]
line-length = 100
